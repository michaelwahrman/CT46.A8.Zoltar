  uniforms: { uTime: { value: 0 }, uA: { value: 0 }, uRx: { value: 3 }, uRz: { value: 1.7 }, uPR: { value: renderer.getPixelRatio() } },
  vertexShader: `
    attribute float seed; uniform float uTime, uRx, uRz, uPR; varying float vTw;
    void main(){
      float a = position.x*6.2832 + uTime*(.05+.1*seed);
      float r = sqrt(position.z);
      float y = fract(position.y + uTime*(.03+.05*seed));
      vec3 p = vec3(cos(a)*r*uRx*1.05, y*1.8, sin(a)*r*uRz*1.05);
      vTw = (.5+.5*sin(uTime*(2.+seed*5.)+seed*60.)) * smoothstep(0.,.15,y)*smoothstep(1.,.6,y);
      vec4 mv = modelViewMatrix*vec4(p,1.);
      gl_PointSize = (2.0+seed*3.5) * uPR * (9./-mv.z);
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: `uniform float uA; varying float vTw;
    void main(){ float d=length(gl_PointCoord-.5); float g=smoothstep(.5,.0,d);
      gl_FragColor=vec4(vec3(1.,.78,.4)*g*g*vTw*uA,1.); }`
});
cardScene.add(new THREE.Points(spGeo, spMat));

// spiral extents, fitted to the bottom region on resize
let Rx = 3, Rz = 1.7;
function fitSpiral() {
  const regionH = H * CFG.cards.regionHeightFraction;
  cardCam.aspect = W / regionH;
  // keep the whole spiral (incl. lifted cards) vertically inside the region
  const dist = cardCam.position.length();
  const halfH = Math.tan(THREE.MathUtils.degToRad(cardCam.fov / 2)) * dist;
  const halfW = halfH * cardCam.aspect;
  Rx = clamp(halfW * 0.88 - CARD_H * 0.6, 1.0, 10);
  Rz = clamp(Math.min(Rx * 0.55, halfH * 0.95 - CARD_H * 0.55), 0.8, 2.2);
  cardCam.updateProjectionMatrix();
  pool.scale.set(Rx * 1.25, Rz * 1.6, 1);
  spMat.uniforms.uRx.value = Rx; spMat.uniforms.uRz.value = Rz;
}

const tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler();
const qFlip = new THREE.Quaternion(), Y_AXIS = new THREE.Vector3(0, 1, 0);
const spawn = new THREE.Vector3(0, 2.6, -1.0);
const target = new THREE.Vector3();
const path = { th: 0, r: 1, flight: 0, flip: 0 };

// One loop of the shuffle, u in [0,1):
//   [0, tableFraction)  cards spiral inward on the table, fanned like petals
//   [tableFraction, 1)  at the centre each card is lifted, flipped, and swept
//                       back out overhead in one wide turn to re-join the edge.
function spiralPos(u, out) {
  const C = CFG.cards, tf = C.tableFraction, inner = C.innerRadius;
  let r, th, y, flight = 0;
  if (u < tf) {
    const k = u / tf;
    r = 1 - (1 - inner) * k;
    th = 2 * Math.PI * C.turns * k;
    y = 0.012 * k;                                 // slight stacking toward centre
  } else {
    flight = (u - tf) / (1 - tf);
    const e = easeInOutCubic(flight);
    r = inner + (1 - inner) * e;
    th = 2 * Math.PI * (C.turns + flight);
    y = C.flightLift * Math.sin(Math.PI * flight);
  }
  out.set(Rx * r * Math.cos(th), y, Rz * r * Math.sin(th));
  path.th = th; path.r = r; path.flight = flight;
  path.flip = flight > 0 ? 2 * Math.PI * C.flightFlips * smooth(0.05, 0.95, flight) : 0;
  return th;
}

function updateCards(phase, t, tDeal) {
  const C = CFG.cards;
  for (let i = 0; i < N; i++) {
    const c = cards[i];
    const local = tDeal - i * C.dealStagger;
    if (local < 0) { c.mesh.visible = false; continue; }
    c.mesh.visible = !c.selected;          // a selected card is drawn by the hero scene instead
    const u = ((c.offset + phase) % 1 + 1) % 1;
    c.u = local >= C.dealFlight ? u : undefined;
    spiralPos(u, target);

    // radial "petal" orientation: long axis points out from the centre,
    // face up and tipped toward the viewer; flips about its long axis in flight
    const ang = Math.atan2(target.z / Rz, target.x / Rx);
    const yaw = -ang - Math.PI / 2;
    const lift = path.flight > 0 ? Math.sin(Math.PI * path.flight) * 0.6 : 0;
    const pitch = -Math.PI / 2 + C.tilt + lift;
    const roll = 0.04 * Math.sin(t * 1.3 + c.wobble);
    tmpE.set(pitch, yaw, roll, 'YXZ');
    c.mesh.quaternion.setFromEuler(tmpE);
    qFlip.setFromAxisAngle(Y_AXIS, path.flip);
    c.mesh.quaternion.multiply(qFlip);

    // deal-in flight from above the table
    const f = easeOutCubic(clamp(local / C.dealFlight, 0, 1));
    c.mesh.position.lerpVectors(spawn, target, f);
    if (f < 1) { tmpQ.setFromAxisAngle(Y_AXIS, (1 - f) * Math.PI * 4); c.mesh.quaternion.multiply(tmpQ); }
    c.mesh.scale.setScalar(lerp(0.4, 1, f) * (0.9 + 0.1 * path.r));

    // shade: nearer cards brighter, cards over the lamp brighter, airborne cards catch light
    const depth = clamp((target.z / Math.max(Rz, 0.01)) * 0.5 + 0.5, 0, 1);
    const b = (0.62 + 0.38 * depth) * (0.85 + 0.15 * (1 - path.r)) * (1 + 0.25 * Math.sin(Math.PI * path.flight)) * lerp(0.3, 1, f);
    c.mat.color.setRGB(b, b * 0.97, b * 0.92);
  }
}

// ================================================================ SELECTED CARD (A3)
// The chosen card leaves the bottom-third spiral and is re-drawn in a full-screen "hero" scene whose
// perspective camera is set up so 1 world unit = 1 CSS pixel at z = 0 (origin at screen centre, +y up).
const heroScene = new THREE.Scene();
const heroCam = new THREE.PerspectiveCamera(30, 1, 1, 20000);
const heroMat = new THREE.MeshBasicMaterial({ map: cardTex, side: THREE.DoubleSide, alphaTest: 0.5, alphaToCoverage: true });
const heroCard = new THREE.Mesh(new THREE.PlaneGeometry(CFG.cards.aspect, 1), heroMat);
heroCard.visible = false;
const haloMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
  uniforms: { uA: { value: 0 }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv; uniform float uA, uTime;
    void main(){
      vec2 p = (vUv-.5)*2.; float r = length(p*vec2(1.25,.8));
      float a = atan(p.y,p.x);
      float rays = .55+.45*sin(a*14.+uTime*.6)*sin(a*5.-uTime*.4);
      float g = smoothstep(1.,.15,r) * (.55 + .45*rays*smoothstep(.2,.9,r));
      gl_FragColor = vec4(vec3(1.,.72,.32)*g*g*uA, 1.);
    }`
});
const halo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), haloMat);
halo.renderOrder = -1; heroCard.renderOrder = 1;
heroScene.add(halo, heroCard);

const sel = {
  state: 'none',          // none | flying | presenting | returning
  card: null, t0: 0, dur: 1,
  from: { p: new THREE.Vector3(), q: new THREE.Quaternion(), h: 1 },
  arrivedAt: 0,
};
const ID_Q = new THREE.Quaternion();
const _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _qs = new THREE.Quaternion();

// where a spiral card currently appears on screen, in hero-scene coordinates
function cardScreenPose(c, out) {
  const rh = H * CFG.cards.regionHeightFraction;
  _v.copy(c.mesh.position).applyMatrix4(cardCam.matrixWorldInverse);
  const depth = -_v.z;
  _v.copy(c.mesh.position).project(cardCam);
  out.p.set(_v.x * W / 2, -H / 2 + (_v.y + 1) / 2 * rh, 0);
  out.h = CARD_H * c.mesh.scale.y / (2 * Math.tan(THREE.MathUtils.degToRad(cardCam.fov / 2)) * depth) * rh;
  out.q.copy(cardCam.quaternion).invert().multiply(c.mesh.quaternion);
  return out;
}
function presentPose() {
  const P = CFG.select;
  return { y: H / 2 - H * P.centerY, h: Math.min(H * P.heightFraction, W * 0.8 / CFG.cards.aspect) };
}
function pickCard() {
  // nearest-to-viewer card lying on the table (not mid-flight, not just dealt)
  let best = null, bz = -Infinity;
  for (const c of cards) {
    if (!c.mesh.visible || c.u === undefined) continue;
    if (c.u < 0.06 || c.u > CFG.cards.tableFraction - 0.08) continue;
    if (c.mesh.position.z > bz) { bz = c.mesh.position.z; best = c; }
  }
  return best;
}
function beginSelect(now, dur) {
  const c = pickCard();
  if (!c) return false;
  sel.card = c; c.selected = true;
  cardScreenPose(c, sel.from);
  sel.state = 'flying'; sel.t0 = now; sel.dur = dur; sel.fortuneOpened = false;
  heroCard.visible = true;
  return true;
}
function beginReturn(now) {
  sel.state = 'returning'; sel.t0 = now; sel.dur = CFG.select.returnTime;
  sel.retFrom = { p: heroCard.position.clone(), q: heroCard.quaternion.clone(), h: heroCard.scale.y };
}

function updateHero(now) {
  const P = CFG.select, pres = presentPose();
  haloMat.uniforms.uTime.value = now;
  if (sel.state === 'none') { heroCard.visible = false; halo.visible = false; return; }
  halo.visible = true;
  const k = clamp((now - sel.t0) / sel.dur, 0, 1);

  if (sel.state === 'flying') {
    const e = easeInOutCubic(k);
    const f = sel.from;
    // quadratic bezier: lift up out of the spiral toward the viewer, then glide to centre stage
    const p1x = f.p.x * 0.4, p1y = Math.max(f.p.y, pres.y) - H * 0.05, p1z = H * 0.35;
    const a = (1 - e) * (1 - e), b = 2 * (1 - e) * e, c2 = e * e;
    heroCard.position.set(a * f.p.x + b * p1x + c2 * 0,
                          a * f.p.y + b * p1y + c2 * pres.y,
                          a * 0 + b * p1z + c2 * 0);
    // un-tilt to face the viewer while spinning twice about its long axis
    _q.copy(f.q).slerp(ID_Q, e);
    _qs.setFromAxisAngle(Y_AXIS, Math.PI * 2 * P.spins * easeInOutCubic(k));
    heroCard.quaternion.copy(_q).multiply(_qs);
    const h = lerp(f.h, pres.h, e);
    heroCard.scale.set(h, h, 1);
    haloMat.uniforms.uA.value = 0.9 * smooth(0.3, 1, k);
    if (k >= 1) { sel.state = 'presenting'; sel.arrivedAt = now; }
  } else if (sel.state === 'presenting') {
    const t = now - sel.arrivedAt;
    heroCard.position.set(0, pres.y + Math.sin(t * 1.1) * H * 0.006, 0);
    _qs.setFromAxisAngle(Y_AXIS, Math.sin(t * 0.7) * 0.16);
    _q.setFromAxisAngle(X_AXIS, Math.sin(t * 0.9 + 1) * 0.04);
    heroCard.quaternion.copy(_qs).multiply(_q);
    heroCard.scale.set(pres.h, pres.h, 1);
    // A7: once the card has come to a halt in centre stage, the fortune window opens
    if (!sel.fortuneOpened && t >= CFG.fortune.openDelay) { sel.fortuneOpened = true; openFortune(now); }
    // flare on arrival, then a slow breathing glow
    haloMat.uniforms.uA.value = 0.75 + 0.15 * Math.sin(t * 1.6) + 1.6 * Math.exp(-t * 2.2);
  } else if (sel.state === 'returning') {
    const e = easeInOutCubic(k);
    const to = cardScreenPose(sel.card, { p: new THREE.Vector3(), q: new THREE.Quaternion(), h: 1 });
    const f = sel.retFrom;
    heroCard.position.lerpVectors(f.p, to.p, e);
    heroCard.position.z = Math.sin(Math.PI * e) * H * 0.15;
    heroCard.quaternion.copy(f.q).slerp(to.q, e);
    const h = lerp(f.h, to.h, e);
    heroCard.scale.set(h, h, 1);
    haloMat.uniforms.uA.value = 0.8 * (1 - e);
    if (k >= 1) {
      sel.card.selected = false; sel.card = null; sel.state = 'none'; heroCard.visible = false;
      btn.classList.remove('gone');            // the button fades back in for the next visitor
    }
  }
  halo.position.set(heroCard.position.x, heroCard.position.y, heroCard.position.z - 1);
  const hs = heroCard.scale.y * 1.9;
  halo.scale.set(hs, hs, 1);
}
const X_AXIS = new THREE.Vector3(1, 0, 0);

// ================================================================ MUSIC + BUTTON (A3, always-on music A4)
const music = {
  ctx: null, engine: null,
  ensure(fast) {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC || !window.ZoltarMusic) return null;
      this.ctx = new AC();
      this.engine = new ZoltarMusic(this.ctx, { volume: CFG.music.volume, swellTime: CFG.music.swellTime });
      this.engine.build();
      this.engine.opts.fadeIn = fast ? 1.2 : CFG.music.fadeIn;
      this.engine.start();
      this.ctx.onstatechange = () => updateSoundHint();
    }
    if (this.ctx.state !== 'running') this.ctx.resume();
    return this.engine;
  },
  swell() { const e = this.ensure(true); if (e) e.swell(this.ctx.currentTime + 0.05); },
  swellTime() { return CFG.music.swellTime; },
};
// The music plays all the time, from page load. Browsers only allow sound to start on its own when
// autoplay is permitted (Chrome/Edge launched by Zoltar_kiosk.bat with --autoplay-policy=no-user-gesture-required,
// a site with high media engagement, or Firefox with autoplay allowed). Otherwise the audio clock waits,
// a small hint is shown, and the very first click / key / touch anywhere lets it play - after that it never stops.
const soundHint = document.getElementById('sound'), pageStart = performance.now() / 1000;
function updateSoundHint() {
  const blocked = !music.ctx || music.ctx.state !== 'running';
  soundHint.classList.toggle('off', !blocked || performance.now() / 1000 - pageStart < 1.5);
}
music.ensure(false);

const btn = document.getElementById('future');
btn.textContent = CFG.select.buttonText;
let surgeStart = -1, surgePeak = -1;
function knowYourFuture() {
  if (btn.classList.contains('gone') || !btn.classList.contains('shown') || sel.state !== 'none') return;
  const now = performance.now() / 1000;
  music.swell();
  const T = music.swellTime();
  surgeStart = now; surgePeak = now + T;
  btn.classList.add('gone');                  // A6: the button fades away
  if (!beginSelect(now, T)) btn.classList.remove('gone');
}
// ---------------------------------------------------------------- A7: fortune window
// Shuffle bag: every fortune is shown once before any repeats; a new round never starts with the last one shown.
const ROMAN = n => [[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']].reduce((s, [v, r]) => { while (n >= v) { s += r; n -= v; } return s; }, '');
const bag = {
  order: [], last: -1,
  next() {
    if (!FORTUNES.length) return null;
    if (!this.order.length) {
      this.order = FORTUNES.map((_, i) => i);
      for (let i = this.order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [this.order[i], this.order[j]] = [this.order[j], this.order[i]]; }
      const n = this.order.length;
      if (n > 1 && this.order[n - 1] === this.last) [this.order[0], this.order[n - 1]] = [this.order[n - 1], this.order[0]];
    }
    this.last = this.order.pop();
    return FORTUNES[this.last];
  }
};
const fx = { el: document.getElementById('fortune'), state: 'hidden', openedAt: 0, current: null, shown: 0 };
const fxIn = fx.el.querySelector('.fx-in');
function openFortune(now) {
  const f = bag.next();
  if (!f) { beginReturn(now); return; }                 // no fortunes at all: behave like A6
  fx.current = f; fx.shown++;
  document.getElementById('fx-num').textContent = 'Fortune ' + ROMAN(f.id || 0);
  document.getElementById('fx-title').textContent = f.title;
  document.getElementById('fx-text').textContent = f.text;
  fxIn.scrollTop = 0;
  fx.el.setAttribute('aria-hidden', 'false');
  fx.el.classList.add('open');
  fx.state = 'open'; fx.openedAt = now;
}
// Close the fortune; the card then flies back into the spiral and the button fades back in.
function closeFortune(force) {
  const now = performance.now() / 1000;
  if (fx.state !== 'open' || sel.state !== 'presenting') return false;
  if (!force && now - fx.openedAt < CFG.fortune.minShowSeconds) return false;
  fx.el.classList.remove('open');
  fx.el.setAttribute('aria-hidden', 'true');
  fx.state = 'hidden';
  beginReturn(now);
  return true;
}
function hideFortuneNow() { fx.el.classList.remove('open'); fx.el.setAttribute('aria-hidden', 'true'); fx.state = 'hidden'; }

btn.addEventListener('click', e => { e.stopPropagation(); btn.blur(); knowYourFuture(); });
// A click / tap anywhere (the window included) closes the fortune. 'click' rather than 'pointerdown' so that
// scrolling a long fortune on a touch screen doesn't close it. Clicks while the card flies are ignored.
window.addEventListener('click', e => { if (fx.state === 'open') { e.preventDefault(); closeFortune(false); } });
setInterval(() => {
  if (fx.state === 'open' && CFG.fortune.autoCloseSeconds > 0 &&
      performance.now() / 1000 - fx.openedAt > CFG.fortune.autoCloseSeconds) closeFortune(true);
}, 500);
// any interaction (re)starts the audio clock if the browser was holding it
for (const ev of ['pointerdown', 'keydown', 'touchstart']) window.addEventListener(ev, () => music.ensure(false), { capture: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) music.ensure(false); });
setInterval(() => { if (music.ctx && music.ctx.state === 'suspended') music.ctx.resume().catch(() => {}); updateSoundHint(); }, 1000);

function surgeAmount(now) {
  if (surgeStart < 0) return 0;
  if (now < surgePeak) return smooth(surgeStart, surgePeak, now);
  return Math.exp(-(now - surgePeak) / 1.6);
}

// ================================================================ LAYOUT / TIMING
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H);
  bgMat.uniforms.uRes.value.set(W, H);
  uiCam.left = -W / 2; uiCam.right = W / 2; uiCam.top = H / 2; uiCam.bottom = -H / 2;
  uiCam.updateProjectionMatrix();
  heroCam.aspect = W / H;
  heroCam.position.set(0, 0, (H / 2) / Math.tan(THREE.MathUtils.degToRad(heroCam.fov / 2)));
  heroCam.lookAt(0, 0, 0);
  heroCam.updateProjectionMatrix();
  spMat.uniforms.uPR.value = renderer.getPixelRatio();
  fitSpiral();
  btn.style.top = (CFG.select.buttonY * 100) + '%';
}
window.addEventListener('resize', resize);
resize();
// pre-compile the selected-card shaders so the first click doesn't stall (that stall delayed the button fade)
heroCard.visible = halo.visible = true;
renderer.compile(heroScene, heroCam);
heroCard.visible = halo.visible = false;

let t0 = performance.now() / 1000;
function replay() {
  t0 = performance.now() / 1000;
  btn.classList.remove('shown');
  if (sel.card) sel.card.selected = false;
  sel.state = 'none'; sel.card = null; btn.classList.remove('gone');
  hideFortuneNow();
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') replay();
  else if (k === ' ' || k === 'enter') {
    e.preventDefault();
    if (e.repeat) return;                                   // a held key never double-fires
    if (fx.state === 'open') closeFortune(false);
    else if (sel.state === 'none') knowYourFuture();        // ignored while the card flies / returns
  }
  else if (k === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  else if (k === 'h') { for (const id of ['ver', 'help']) { const el = document.getElementById(id); el.style.display = el.style.display === 'none' ? '' : 'none'; } }
});

function layoutTitle(t) {
  const I = CFG.intro;
  const big = Math.min(H, W) * I.introSizeOfMinDim;
  // the logo itself fills ~contentFraction of the square art, so scale the square so the
  // visible logo occupies the top finalHeightFraction of the screen
  const band = H * CFG.title.finalHeightFraction;
  const small = Math.min(band / CFG.title.contentFraction, W * 0.9);
  const yBig = 0, ySmall = H / 2 - band / 2;
  const tFade = clamp(t / I.fadeIn, 0, 1);
  const tMove = easeInOutCubic(clamp((t - I.fadeIn - I.hold) / I.move, 0, 1));
  const size = lerp(big * lerp(0.9, 1, easeOutCubic(tFade)), small, tMove);
  title.scale.set(size, size, 1);
  title.position.set(0, lerp(yBig, ySmall, tMove), 0);
  titleMat.uniforms.uAlpha.value = smooth(0, 1, tFade);
}

// ================================================================ LOOP
let lastNow = performance.now() / 1000, phase = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  const dt = Math.min(0.1, now - lastNow); lastNow = now;
  const t = now - t0;                 // time since intro start
  const I = CFG.intro;
  const tDeal = t - (I.fadeIn + I.hold + CFG.cards.dealDelayAfterMoveStart);
  const cardsIn = smooth(0, 1.5, tDeal);

  // the button appears once the cards have been dealt
  if (!btn.classList.contains('shown') && tDeal > CFG.cards.dealStagger * N + CFG.cards.dealFlight) btn.classList.add('shown');

  // the spiral whirls faster as the music swells, then settles
  const surge = surgeAmount(now);
  phase += dt / CFG.cards.loopSeconds * (1 + CFG.select.spiralBoost * surge);

  bgMat.uniforms.uTime.value = now;
  bgMat.uniforms.uCardsIn.value = cardsIn * (1 + 1.3 * surge);
  titleMat.uniforms.uTime.value = now;
  spMat.uniforms.uTime.value = now;
  spMat.uniforms.uA.value = cardsIn * (1 + 2.5 * surge);
  poolMat.uniforms.uA.value = cardsIn * (1 + 1.6 * surge);

  layoutTitle(t);
  updateCards(phase, now, tDeal);
  updateHero(now);

  renderer.setViewport(0, 0, W, H);
  renderer.setScissorTest(false);
  renderer.clear();
  renderer.render(bgScene, bgCam);

  // cards live in the bottom region of the screen
  const rh = Math.round(H * CFG.cards.regionHeightFraction);
  renderer.setViewport(0, 0, W, rh);
  renderer.setScissor(0, 0, W, rh);
  renderer.setScissorTest(true);
  renderer.clearDepth();
  renderer.render(cardScene, cardCam);
  renderer.setScissorTest(false);

  renderer.setViewport(0, 0, W, H);
  renderer.render(uiScene, uiCam);
  renderer.clearDepth();
  renderer.render(heroScene, heroCam);
  if (window.__zoltarAfterFrame) window.__zoltarAfterFrame();   // A8: the movie recorder copies this frame
}
frame();

// test hook (used by the automated screenshot check)
window.__zoltar = { CFG, cards, replay, knowYourFuture, sel, music, fx, bag, closeFortune, get FORTUNES() { return FORTUNES; }, get Rx() { return Rx; }, get Rz() { return Rz; } };
})();
</script>
<!-- A8: movie recording (button "● Make movie", keys M / V) -->
<script src="CT46.A8.Zoltar_movie.js"></script>
</body>
